# Render Blueprint for the D&Z Field App.
# In Render, choose "New +" then "Blueprint", point it at this repo, and
# Render creates both the web service and the Postgres database in one go,
# wiring DATABASE_URL from the database into the app automatically.
#
# Plan names below are starting points. If Render shows a different set when
# you deploy, pick the closest small paid tier; it will flag any name it does
# not recognize.

services:
  - type: web
    name: dz-field-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dz-field-app-db
          property: connectionString
      # Signs the admin session cookie. Render generates a strong value; you
      # never see or paste it.
      - key: SESSION_SECRET
        generateValue: true
      # The passcode for the /admin captures view. Render prompts you to set
      # this in the dashboard; it is not stored in the repo. Leave it unset to
      # keep /admin closed.
      - key: ADMIN_PASSCODE
        sync: false
      # The Claude API key the sorter uses. Set it in the Render dashboard; it
      # is never stored in the repo. The sort test stays closed until it is set.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: dz-field-app-db
    plan: basic-256mb
